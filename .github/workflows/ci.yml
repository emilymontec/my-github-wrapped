name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/github_wrapped
          AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret
          AUTH_URL: http://localhost:3000
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
          TOKEN_ENCRYPTION_KEY: ci-token-encryption-key

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github_wrapped
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d github_wrapped"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/github_wrapped
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret
      AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: ci
      GITHUB_CLIENT_SECRET: ci
      TOKEN_ENCRYPTION_KEY: ci-token-encryption-key
      INNGEST_DEV: "1"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database schema
        run: npx prisma db push

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
