name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un push nuevo cancela la corrida anterior de la misma rama en vez de
# dejarla corriendo en paralelo -- evita gastar minutos de runner en
# runs que ya fueron reemplazados (y es lo que hasta ahora se hacía a
# mano, con los runs quedando en estado "cancelled" a mitad del job e2e).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/github_wrapped
          AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret
          AUTH_URL: http://localhost:3000
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
          TOKEN_ENCRYPTION_KEY: ci-token-encryption-key

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    if: ${{ !cancelled() }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github_wrapped
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d github_wrapped"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/github_wrapped
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret
      AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: ci
      GITHUB_CLIENT_SECRET: ci
      TOKEN_ENCRYPTION_KEY: ci-token-encryption-key
      INNGEST_DEV: "1"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database schema
        run: npx prisma db push

      - name: Start Inngest Dev Server
        run: |
          npx --ignore-scripts=false inngest-cli@latest dev -u http://localhost:3000/api/inngest > /tmp/inngest.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8288; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/inngest.log
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        # `always()` en vez de `failure()`: un run cancelado (o uno cuyo
        # job falló antes del paso) también debe dejar el HTML report +
        # los screenshots/traces de `test-results/` como artefacto, que
        # es justamente lo que falta para diagnosticar error.txt.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
